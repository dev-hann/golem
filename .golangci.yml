version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Style
    - lll
    - godot
    - misspell
    - whitespace
    - wsl_v5
    # Correctness
    - staticcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - unused
    - copyloopvar
    - intrange
    - bodyclose
    - noctx
    # Idiomatic Go
    - revive
    - gocritic
    - unconvert
    - unparam
    - prealloc
    - exhaustive
    # Size & complexity gates
    - funlen
    - gocyclo
    - gomodguard_v2
    # Security
    - gosec

  settings:
    lll:
      line-length: 120
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
      disabled-checks:
        - hugeParam
        - rangeValCopy
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: var-naming
        - name: package-comments
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    exhaustive:
      default-signifies-exhaustive: false
    gosec:
      excludes:
        - G104
    wsl_v5:
      strict-append: true
      allow-whole-block: false

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - lll
          - errcheck
          - gosec
          - wsl_v5
      - path: docs/
        linters:
          - all

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dev-hann/golem

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
